<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="100%" height="100%">
  <defs>
    <pattern id="grid" width="25" height="25" patternUnits="userSpaceOnUse">
      <path d="M 25 0 L 0 0 0 25" fill="none" stroke="rgba(148, 163, 184, 0.08)" stroke-width="1"/>
    </pattern>
    <linearGradient id="wallGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="entryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(245, 176, 39, 0.15)" />
      <stop offset="100%" stop-color="rgba(245, 176, 39, 0.03)" />
    </linearGradient>
  </defs>

  <!-- Fundo da Planta / Piso da Loja -->
  <rect width="1000" height="650" fill="#0b1120" />
  <rect width="1000" height="650" fill="url(#grid)" />

  <!-- Limite / Paredes Mestras da Loja -->
  <rect x="40" y="40" width="920" height="570" rx="8" fill="none" stroke="url(#wallGrad)" stroke-width="10" />

  <!-- ZONAS DE LOJA (Planta de Arquitetura Fnac Cascais) -->

  <!-- Zona 1: Entrada Principal & Receção Multimédia -->
  <g id="zone-entrada">
    <rect x="50" y="50" width="340" height="280" fill="url(#entryGrad)" stroke="rgba(245, 176, 39, 0.3)" stroke-width="1.5" stroke-dasharray="4 2" rx="6" />
    <text x="70" y="85" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700" fill="#F5B027" letter-spacing="1">ENTRADA PRINCIPAL &amp; RECEÇÃO</text>
    <text x="70" y="105" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#94A3B8">Zona de Acolhimento • Video Wall LED 4x4</text>
    <!-- Pórtico de Entrada -->
    <path d="M 40 140 L 40 240" stroke="#F5B027" stroke-width="8" stroke-linecap="round" />
    <text x="52" y="195" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#F5B027" transform="rotate(-90 52 195)">ACESSO SHOPPING</text>
    <rect x="180" y="130" width="130" height="70" rx="4" fill="rgba(30, 41, 59, 0.7)" stroke="rgba(255, 255, 255, 0.1)" />
    <text x="245" y="170" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" fill="#CBD5E1" text-anchor="middle">Balcão de Boas-Vindas</text>
  </g>

  <!-- Zona 2: Montra Lateral & Corredor Externo -->
  <g id="zone-montra">
    <rect x="680" y="50" width="270" height="220" fill="rgba(59, 130, 246, 0.05)" stroke="rgba(59, 130, 246, 0.3)" stroke-width="1.5" stroke-dasharray="4 2" rx="6" />
    <text x="700" y="85" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700" fill="#60A5FA" letter-spacing="1">MONTRA LATERAL</text>
    <text x="700" y="105" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#94A3B8">Visibilidade Corredor • Telas Duplas 4K</text>
    <!-- Vidro da montra exterior -->
    <path d="M 960 60 L 960 260" stroke="#60A5FA" stroke-width="6" stroke-linecap="round" />
    <text x="948" y="165" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#60A5FA" transform="rotate(90 948 165)">FACHADA VIDRO</text>
    <rect x="730" y="130" width="160" height="40" rx="4" fill="rgba(30, 41, 59, 0.8)" stroke="rgba(255, 255, 255, 0.1)" />
    <text x="810" y="155" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#94A3B8" text-anchor="middle">Pódio de Destaques Tech</text>
  </g>

  <!-- Zona 3: Fórum Cultural & Bilheteira Fnac -->
  <g id="zone-forum">
    <rect x="410" y="50" width="250" height="240" fill="rgba(147, 51, 234, 0.05)" stroke="rgba(147, 51, 234, 0.3)" stroke-width="1.5" stroke-dasharray="4 2" rx="6" />
    <text x="430" y="85" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700" fill="#C084FC" letter-spacing="1">FÓRUM CULTURAL</text>
    <text x="430" y="105" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#94A3B8">Auditório • Bilheteira • Totem Interativo</text>
    <!-- Palco e Cadeiras -->
    <path d="M 440 210 Q 535 180 630 210" fill="none" stroke="rgba(192, 132, 252, 0.4)" stroke-width="2" />
    <rect x="480" y="130" width="110" height="45" rx="4" fill="rgba(30, 41, 59, 0.8)" stroke="rgba(255, 255, 255, 0.1)" />
    <text x="535" y="158" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" fill="#E2E8F0" text-anchor="middle">Palco / Auditório</text>
  </g>

  <!-- Zona 4: Tecnologia, Livraria & Espaço Central -->
  <g id="zone-tech-livraria">
    <rect x="50" y="350" width="370" height="250" fill="rgba(16, 185, 129, 0.04)" stroke="rgba(16, 185, 129, 0.25)" stroke-width="1.5" stroke-dasharray="4 2" rx="6" />
    <text x="70" y="385" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700" fill="#34D399" letter-spacing="1">UNIVERSO EDITORIAL &amp; SOM</text>
    <text x="70" y="405" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#94A3B8">Livros, Vinil &amp; Auscultadores Premium</text>
    <!-- Mesas de exposição -->
    <rect x="80" y="440" width="70" height="120" rx="3" fill="rgba(30, 41, 59, 0.6)" stroke="rgba(255, 255, 255, 0.08)" />
    <rect x="180" y="440" width="70" height="120" rx="3" fill="rgba(30, 41, 59, 0.6)" stroke="rgba(255, 255, 255, 0.08)" />
    <rect x="280" y="440" width="70" height="120" rx="3" fill="rgba(30, 41, 59, 0.6)" stroke="rgba(255, 255, 255, 0.08)" />
    <text x="115" y="505" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" fill="#64748B" text-anchor="middle">Gôndola 1</text>
    <text x="215" y="505" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" fill="#64748B" text-anchor="middle">Gôndola 2</text>
    <text x="315" y="505" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" fill="#64748B" text-anchor="middle">Gôndola 3</text>
  </g>

  <!-- Zona 5: Linha de Caixas & Apoio ao Cliente -->
  <g id="zone-caixas">
    <rect x="440" y="320" width="510" height="280" fill="rgba(239, 68, 68, 0.04)" stroke="rgba(239, 68, 68, 0.25)" stroke-width="1.5" stroke-dasharray="4 2" rx="6" />
    <text x="460" y="355" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700" fill="#F87171" letter-spacing="1">LINHA DE CAIXAS &amp; CLUBE FNAC</text>
    <text x="460" y="375" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#94A3B8">Telas de Menu Dinâmico • Atendimento Rápido</text>

    <!-- Balcão de Caixas Contínuo -->
    <rect x="470" y="420" width="450" height="60" rx="4" fill="rgba(30, 41, 59, 0.85)" stroke="rgba(255, 255, 255, 0.15)" />
    <text x="695" y="456" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600" fill="#F8FAFC" text-anchor="middle">Bancada Central de Caixas &amp; Pagamentos (5 Postos)</text>

    <!-- Postos individuais -->
    <circle cx="530" cy="450" r="14" fill="#0f172a" stroke="rgba(245, 176, 39, 0.5)" />
    <text x="530" y="454" font-family="'JetBrains Mono', monospace" font-size="10" fill="#F5B027" text-anchor="middle">C1</text>
    <circle cx="610" cy="450" r="14" fill="#0f172a" stroke="rgba(245, 176, 39, 0.5)" />
    <text x="610" y="454" font-family="'JetBrains Mono', monospace" font-size="10" fill="#F5B027" text-anchor="middle">C2</text>
    <circle cx="690" cy="450" r="14" fill="#0f172a" stroke="rgba(245, 176, 39, 0.5)" />
    <text x="690" y="454" font-family="'JetBrains Mono', monospace" font-size="10" fill="#F5B027" text-anchor="middle">C3</text>
    <circle cx="770" cy="450" r="14" fill="#0f172a" stroke="rgba(245, 176, 39, 0.5)" />
    <text x="770" y="454" font-family="'JetBrains Mono', monospace" font-size="10" fill="#F5B027" text-anchor="middle">C4</text>
    <circle cx="850" cy="450" r="14" fill="#0f172a" stroke="rgba(245, 176, 39, 0.5)" />
    <text x="850" y="454" font-family="'JetBrains Mono', monospace" font-size="10" fill="#F5B027" text-anchor="middle">C5</text>

    <!-- Fila de Espera com Sinalética -->
    <rect x="520" y="520" width="350" height="40" rx="3" fill="none" stroke="rgba(148, 163, 184, 0.2)" stroke-dasharray="3 3" />
    <text x="695" y="545" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" fill="#64748B" text-anchor="middle">Guia de Fila Única Inteligente</text>
  </g>

  <!-- Marcador de Orientação / Rosa dos Ventos Simples -->
  <g transform="translate(900, 60)">
    <circle cx="20" cy="20" r="18" fill="rgba(15, 23, 42, 0.8)" stroke="rgba(255, 255, 255, 0.15)" />
    <path d="M 20 8 L 24 20 L 20 17 L 16 20 Z" fill="#F5B027" />
    <text x="20" y="32" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" font-weight="700" fill="#94A3B8" text-anchor="middle">N</text>
  </g>

  <!-- Legenda de Escala & Área -->
  <g transform="translate(60, 580)">
    <line x1="0" y1="0" x2="80" y2="0" stroke="rgba(255, 255, 255, 0.4)" stroke-width="2" />
    <line x1="0" y1="-4" x2="0" y2="4" stroke="rgba(255, 255, 255, 0.4)" stroke-width="2" />
    <line x1="80" y1="-4" x2="80" y2="4" stroke="rgba(255, 255, 255, 0.4)" stroke-width="2" />
    <text x="40" y="-8" font-family="'JetBrains Mono', monospace" font-size="9" fill="#94A3B8" text-anchor="middle">10 m</text>
    <text x="100" y="3" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" fill="#64748B">Área Bruta: 1.420 m² • Piso 1</text>
  </g>
</svg>
